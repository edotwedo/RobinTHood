name: iOS TestFlight

# iOS-only release, separate from android-apk.yml so a TestFlight upload never
# touches the Play tracks. Runs on push to paul/ios-testflight or by hand.
on:
  push:
    branches: [paul/ios-testflight]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-release:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Real AdMob IDs, baked in at build time so no test IDs reach a release. Blank until
      # the AdMob account exists; AdBanner falls back to Google's test banner.
      ROBIN_ADMOB_IOS_APP: ${{ secrets.ROBIN_ADMOB_IOS_APP }}
      ROBIN_ADMOB_IOS_BANNER: ${{ secrets.ROBIN_ADMOB_IOS_BANNER }}
      # app.json's buildNumber is a stale 6. Prebuild and the stamp step both use this,
      # because a literal CFBundleVersion of 6 is what TestFlight reads.
      ROBIN_IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Unit tests (every *.test.mjs)
        run: node --test *.test.mjs

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      # prebuild writes app.json's "6" into the plist as a literal. xcodebuild's
      # CURRENT_PROJECT_VERSION does not replace that literal, so stamp it here.
      - name: Stamp iOS build number
        run: node iosBuild.js

      - name: Install CocoaPods
        working-directory: android-app/ios
        run: pod install

      # Fail closed: without the key, signing silently falls back to nothing and the
      # upload fails later with a vaguer message.
      - name: Install App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::iOS release needs ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets; see docs/IOS-RELEASE.md."
            exit 1
          fi
          KEY_DIR="$HOME/private_keys"; mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # method app-store-connect is the Xcode 15.3+ spelling (app-store is deprecated);
      # destination upload hands the .ipa straight to App Store Connect, so there is no
      # separate altool step.
      # Manual App Store signing. Automatic signing asks for a Development profile, which
      # Apple refuses while the team has no registered devices. The cert and profile were
      # made through the ASC API (cert RQ6UBTT29K, profile 4K82B7463F).
      - name: Install distribution cert and App Store profile
        working-directory: android-app/ios
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(openssl rand -hex 12)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$IOS_DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/robinthood-appstore.mobileprovision"
          ruby -e '
            require "xcodeproj"
            proj = Xcodeproj::Project.open(Dir["*.xcodeproj"].first)
            proj.targets.select { |t| t.name == "RobinTHood" }.each do |t|
              t.build_configurations.each do |c|
                b = c.build_settings
                b["CODE_SIGN_STYLE"] = "Manual"
                b["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
                b["CODE_SIGN_IDENTITY"] = "Apple Distribution"
                b["PROVISIONING_PROFILE_SPECIFIER"] = "RobinTHood AppStore"
              end
            end
            proj.save'

      - name: Write ExportOptions.plist
        working-directory: android-app/ios
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edotwedo.robinthood</key>
              <string>RobinTHood AppStore</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      # CURRENT_PROJECT_VERSION is the run number, so every upload gets a fresh build
      # number and TestFlight never rejects a duplicate. Marketing version stays app.json's.
      - name: Archive
        working-directory: android-app/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1); scheme="${ws%.xcworkspace}"
          echo "Archiving $ws / $scheme"
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RobinTHood.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40

      - name: Export and upload to TestFlight
        working-directory: android-app/ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RobinTHood.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded build ${{ github.run_number }} to TestFlight."
          echo "It appears under App Store Connect > TestFlight once Apple finishes processing."

      # Same archive exported to a local .ipa, kept as a run artifact so a cloud device
      # service (BrowserStack etc.) can install it for review recordings.
      - name: Export .ipa artifact
        working-directory: android-app/ios
        run: |
          set -o pipefail
          sed 's#<string>upload</string>#<string>export</string>#' ExportOptions.plist > ExportLocal.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RobinTHood.xcarchive" \
            -exportOptionsPlist ExportLocal.plist \
            -exportPath "$RUNNER_TEMP/ipa-local" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -20
          ls -la "$RUNNER_TEMP/ipa-local"

      - uses: actions/upload-artifact@v4
        with:
          name: robinthood-ipa
          path: ${{ runner.temp }}/ipa-local/*.ipa
          retention-days: 14
