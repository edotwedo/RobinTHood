name: Android APK

on:
  push:
    branches: [master, claude/android-rebuild]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds on Phil's build PC (self-hosted Windows runner "donnas-pc"), which keeps
  # Gradle, NDK and npm caches warm between runs. Run steps use Git Bash.
  build:
    runs-on: [self-hosted, Windows, donnas-pc]
    timeout-minutes: 90
    env:
      # Search worker signing key; app.config.js bakes it into extra.robinSecret.
      ROBIN_CLIENT_SECRET: ${{ secrets.ROBIN_CLIENT_SECRET }}
      # Real AdMob IDs, read by adsConfig.js; empty keeps Google's test IDs.
      ROBIN_ADMOB_ANDROID_APP: ${{ secrets.ROBIN_ADMOB_ANDROID_APP }}
      ROBIN_ADMOB_ANDROID_BANNER: ${{ secrets.ROBIN_ADMOB_ANDROID_BANNER }}
    defaults:
      run:
        working-directory: android-app
        shell: bash
    steps:
      # React Native's native build paths run long; let git check them out.
      # cmd, not powershell: the PC's execution policy blocks the .ps1 files Actions writes.
      - name: Enable long paths for git
        shell: cmd
        working-directory: .
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      # The runner runs as SYSTEM, whose PATH lacks Git's bash.
      - name: Put Git Bash on PATH
        shell: cmd
        working-directory: .
        run: '>>"%GITHUB_PATH%" echo C:\Program Files\Git\bin'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the SDK command-line tools and accepts licenses, so Gradle can fetch the
      # platforms, build-tools, NDK and CMake the app needs. The SDK lives in D:\android-sdk
      # so it survives between runs. (android-actions/setup-android can't unpack on this
      # runner: Expand-Archive rejects its extension-less download.)
      - name: Android SDK (persistent on the build PC)
        working-directory: .
        run: |
          SDK='D:\android-sdk'
          SDKU=$(cygpath -u "$SDK")
          TOOLS="$SDKU/cmdline-tools/latest/bin/sdkmanager.bat"
          if [ ! -f "$TOOLS" ]; then
            ZIP="$(cygpath -u "$RUNNER_TEMP")/cmdline-tools.zip"
            curl -fsSL -o "$ZIP" https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip
            rm -rf "$SDKU/cmdline-tools/tmp" && mkdir -p "$SDKU/cmdline-tools"
            powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::ExtractToDirectory('$(cygpath -w "$ZIP")', '$SDK\cmdline-tools\tmp')"
            mv "$SDKU/cmdline-tools/tmp/cmdline-tools" "$SDKU/cmdline-tools/latest"
            rm -rf "$SDKU/cmdline-tools/tmp"
          fi
          yes | "$TOOLS" --sdk_root="$SDK" --licenses > /dev/null || true
          ls "$SDKU/licenses"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # React Native's C++ object paths exceed Windows' 260-character limit. The ninja in
      # the SDK's CMake 3.22.1 is 1.10.2, which can't use long paths; 1.12+ can (Windows
      # LongPathsEnabled is on). Install CMake up front and swap in ninja 1.12.1, once.
      - name: Long-path ninja for the C++ build
        working-directory: .
        run: |
          SDKU=$(cygpath -u "$ANDROID_HOME")
          NINJA="$SDKU/cmake/3.22.1/bin/ninja.exe"
          [ -f "$NINJA" ] || "$SDKU/cmdline-tools/latest/bin/sdkmanager.bat" --sdk_root="$ANDROID_HOME" "cmake;3.22.1" > /dev/null
          if [ "$("$NINJA" --version)" != "1.12.1" ]; then
            ZIP="$(cygpath -u "$RUNNER_TEMP")/ninja-win.zip"
            curl -fsSL -o "$ZIP" https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
            OUT="$(cygpath -u "$RUNNER_TEMP")/ninja-new" && rm -rf "$OUT" && mkdir -p "$OUT"
            powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::ExtractToDirectory('$(cygpath -w "$ZIP")', '$(cygpath -w "$OUT")')"
            cp "$NINJA" "$NINJA.1.10.2.bak" 2>/dev/null || true
            cp "$OUT/ninja.exe" "$NINJA"
          fi
          "$NINJA" --version

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Unit tests (every *.test.mjs)
        run: node --test *.test.mjs

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Build Play bundle (all architectures)
        working-directory: android-app/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect APK and bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RobinTHood.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/RobinTHood-unsigned.aab
          sha256sum dist/*

      # Fail the build if the Play app picks up permissions it must not have
      # (libraries can add them silently through their own manifests).
      - name: Check Play build permissions
        run: |
          SDK=$(cygpath -u "$ANDROID_HOME" 2>/dev/null || echo "$ANDROID_HOME"); AAPT=$( (ls "$SDK"/build-tools/*/aapt "$SDK"/build-tools/*/aapt.exe 2>/dev/null || true) | sort -V | tail -1)
          perms=$("$AAPT" dump permissions dist/RobinTHood.apk)
          echo "$perms"
          for bad in RECORD_AUDIO SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE FOREGROUND_SERVICE CAMERA ACCESS_FINE_LOCATION READ_CONTACTS; do
            if echo "$perms" | grep -q "android.permission.$bad"; then echo "::error::Play build has $bad"; exit 1; fi
          done

      # Phil's personal build: separate app (com.edotwedo.robinthood.phil) with
      # All files access. Never published publicly; it goes to a draft release below.
      - name: Build personal all-files APK
        env:
          ROBIN_ALL_FILES: '1'
        run: |
          npx expo prebuild --platform android --clean --no-install
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon)
          mkdir -p personal
          cp android/app/build/outputs/apk/release/app-release.apk personal/Robin-Phil-allfiles.apk
          sha256sum personal/*
          SDK=$(cygpath -u "$ANDROID_HOME" 2>/dev/null || echo "$ANDROID_HOME"); AAPT=$( (ls "$SDK"/build-tools/*/aapt "$SDK"/build-tools/*/aapt.exe 2>/dev/null || true) | sort -V | tail -1)
          perms=$("$AAPT" dump permissions personal/Robin-Phil-allfiles.apk); echo "$perms"
          echo "$perms" | grep -q MANAGE_EXTERNAL_STORAGE || { echo "::error::personal build lacks All files access"; exit 1; }
          if echo "$perms" | grep -qE "RECORD_AUDIO|SYSTEM_ALERT_WINDOW"; then echo "::error::personal build has mic/overlay"; exit 1; fi

      # Sign the Play bundle with the upload key, when the key is stored in repo secrets
      # (PLAY_UPLOAD_KEYSTORE_B64 and PLAY_UPLOAD_KEY_PASSWORD). Without them, the bundle
      # is published unsigned-for-Play and must be signed by hand with the upload key.
      - name: Sign Play bundle
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key in secrets; leaving bundle unsigned."; exit 0; fi
          # Never leave the upload key on the build PC, even if signing fails (Paul-53, review of #19).
          trap 'rm -f upload.jks' EXIT
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          cp dist/RobinTHood-unsigned.aab dist/RobinTHood-play.aab
          # Drop the existing signature; Git Bash on Windows has no zip, so use .NET there.
          if command -v zip >/dev/null; then
            zip -q -d dist/RobinTHood-play.aab 'META-INF/*'
          else
            powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem; \$z = [IO.Compression.ZipFile]::Open((Resolve-Path 'dist/RobinTHood-play.aab'), 'Update'); @(\$z.Entries | Where-Object { \$_.FullName -like 'META-INF/*' }) | ForEach-Object { \$_.Delete() }; \$z.Dispose()"
          fi
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" dist/RobinTHood-play.aab upload
          rm upload.jks dist/RobinTHood-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RobinTHood-android
          path: android-app/dist/*

      # Draft releases are visible only to people with access to the repo.
      # Only the main branches publish; a test run on another branch just keeps the artifact.
      - name: Publish personal build to a private draft release
        if: github.ref_name == 'master' || github.ref_name == 'claude/android-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phil-personal --yes --cleanup-tag || true
          gh release create phil-personal personal/Robin-Phil-allfiles.apk \
            --draft \
            --target "${{ github.sha }}" \
            --title "Robin (Phil) personal build" \
            --notes "Phil only. Separate app with All files access. Built from ${{ github.sha }}."


      # Fixed tag so the phone download link never changes. Marked prerelease so the
      # Windows app's /releases/latest update check never picks it up.
      - name: Publish to android-latest prerelease
        if: github.ref_name == 'master' || github.ref_name == 'claude/android-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "RobinTHood Android (latest build)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Phone install: RobinTHood.apk. Play Console upload: the .aab bundle."

      # Automatically deploy the signed Play bundle directly to Google Play Closed Testing track (track001)
      - name: Deploy to Google Play Closed Testing (track001)
        if: github.ref_name == 'master' || github.ref_name == 'claude/android-rebuild'
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret configured; skipping Play deployment."
            exit 0
          fi
          if [ ! -f "android-app/dist/RobinTHood-play.aab" ]; then
            echo "Signed Play bundle not found; skipping Play deployment."
            exit 0
          fi
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play_key.json
          trap 'rm -f play_key.json' EXIT
          PYTHON_CMD=""
          if command -v python3 >/dev/null 2>&1; then
            PYTHON_CMD="python3"
          elif command -v python >/dev/null 2>&1; then
            PYTHON_CMD="python"
          elif command -v py >/dev/null 2>&1; then
            PYTHON_CMD="py -3"
          fi
          if [ -z "$PYTHON_CMD" ]; then
            echo "Python not found on runner; skipping Play deployment."
            exit 0
          fi
          $PYTHON_CMD -m pip install --quiet google-api-python-client google-auth
          PLAY_SERVICE_ACCOUNT_KEY=play_key.json $PYTHON_CMD scripts/play_status.py --deploy android-app/dist/RobinTHood-play.aab --track track001

  # iPhone: proves the native iOS app compiles (simulator build, no signing).
  # Installing on real iPhones needs an Apple Developer account + TestFlight.
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: android-app/ios
        run: pod install

      - name: Build for iOS Simulator (no signing)
        working-directory: android-app/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1); scheme="${ws%.xcworkspace}"
          echo "Building $ws / $scheme"
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  # iOS release: archive a signed build and upload it to TestFlight.
  # Manual only, because it signs and uploads. Needs an Apple Developer account and the
  # App Store Connect secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) —
  # see docs/IOS-RELEASE.md for how to create the key and where each value goes.
  ios-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android-app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Real AdMob IDs, baked in at build time so no test IDs reach a release. Blank until
      # the AdMob account exists; AdBanner falls back to Google's test banner.
      ROBIN_ADMOB_IOS_APP: ${{ secrets.ROBIN_ADMOB_IOS_APP }}
      ROBIN_ADMOB_IOS_BANNER: ${{ secrets.ROBIN_ADMOB_IOS_BANNER }}
      # app.json's buildNumber is a stale 6. Prebuild and the stamp step both use this,
      # because a literal CFBundleVersion of 6 is what TestFlight reads.
      ROBIN_IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Unit tests (every *.test.mjs)
        run: node --test *.test.mjs

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      # prebuild writes app.json's "6" into the plist as a literal. xcodebuild's
      # CURRENT_PROJECT_VERSION does not replace that literal, so stamp it here.
      - name: Stamp iOS build number
        run: node iosBuild.js

      - name: Install CocoaPods
        working-directory: android-app/ios
        run: pod install

      # Fail closed: without the key, signing silently falls back to nothing and the
      # upload fails later with a vaguer message.
      - name: Install App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::iOS release needs ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets; see docs/IOS-RELEASE.md."
            exit 1
          fi
          KEY_DIR="$HOME/private_keys"; mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # method app-store-connect is the Xcode 15.3+ spelling (app-store is deprecated);
      # destination upload hands the .ipa straight to App Store Connect, so there is no
      # separate altool step.
      - name: Write ExportOptions.plist
        working-directory: android-app/ios
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      # CURRENT_PROJECT_VERSION is the run number, so every upload gets a fresh build
      # number and TestFlight never rejects a duplicate. Marketing version stays app.json's.
      - name: Archive
        working-directory: android-app/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1); scheme="${ws%.xcworkspace}"
          echo "Archiving $ws / $scheme"
          set -o pipefail
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RobinTHood.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40

      - name: Export and upload to TestFlight
        working-directory: android-app/ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RobinTHood.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded build ${{ github.run_number }} to TestFlight."
          echo "It appears under App Store Connect > TestFlight once Apple finishes processing."
