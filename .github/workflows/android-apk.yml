name: Android APK

on:
  push:
    branches: [master, claude/android-rebuild]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RobinTHood.apk
          sha256sum dist/RobinTHood.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RobinTHood-android
          path: android-app/dist/RobinTHood.apk

      # Fixed tag so the phone download link never changes. Marked prerelease so the
      # Windows app's /releases/latest update check never picks it up.
      - name: Publish to android-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/RobinTHood.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "RobinTHood Android (latest build)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Download RobinTHood.apk on your phone and open it to install."
