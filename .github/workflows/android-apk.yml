name: Android APK

on:
  push:
    branches: [master, claude/android-rebuild]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Build Play bundle (all architectures)
        working-directory: android-app/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect APK and bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RobinTHood.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/RobinTHood-unsigned.aab
          sha256sum dist/*

      # Phil's personal build: separate app (com.edotwedo.robinthood.phil) with
      # All files access. Never published publicly; it goes to a draft release below.
      - name: Build personal all-files APK
        env:
          ROBIN_ALL_FILES: '1'
        run: |
          npx expo prebuild --platform android --clean --no-install
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon)
          mkdir -p personal
          cp android/app/build/outputs/apk/release/app-release.apk personal/Robin-Phil-allfiles.apk
          sha256sum personal/*

      # Sign the Play bundle with the upload key, when the key is stored in repo secrets
      # (PLAY_UPLOAD_KEYSTORE_B64 and PLAY_UPLOAD_KEY_PASSWORD). Without them, the bundle
      # is published unsigned-for-Play and must be signed by hand with the upload key.
      - name: Sign Play bundle
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key in secrets; leaving bundle unsigned."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          cp dist/RobinTHood-unsigned.aab dist/RobinTHood-play.aab
          zip -q -d dist/RobinTHood-play.aab 'META-INF/*'
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks \
            -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" dist/RobinTHood-play.aab upload
          rm upload.jks dist/RobinTHood-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RobinTHood-android
          path: android-app/dist/*

      # Draft releases are visible only to people with access to the repo.
      - name: Publish personal build to a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phil-personal --yes --cleanup-tag || true
          gh release create phil-personal personal/Robin-Phil-allfiles.apk \
            --draft \
            --target "${{ github.sha }}" \
            --title "Robin (Phil) personal build" \
            --notes "Phil only. Separate app with All files access. Built from ${{ github.sha }}."


      # Fixed tag so the phone download link never changes. Marked prerelease so the
      # Windows app's /releases/latest update check never picks it up.
      - name: Publish to android-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "RobinTHood Android (latest build)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Phone install: RobinTHood.apk. Play Console upload: the .aab bundle."
